appId: com.gi.obsmastercontroller
productName: OBS Master Controller
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
# The PowerShell helper must live OUTSIDE the .asar archive so powershell.exe can read it.
extraResources:
  - from: resources/ptz-worker.ps1
    to: ptz-worker.ps1
  - from: resources/icon.ico
    to: icon.ico
# Auto-update feed: electron-builder uploads latest.yml + installer to a GitHub Release (see docs/RELEASING.md).
publish:
  provider: github
  owner: carl-gian
  repo: Project-New-Emeet-Partner-Program
  releaseType: release
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: OBS Master Controller
