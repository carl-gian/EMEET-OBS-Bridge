appId: com.gi.obsmastercontroller
productName: EMEET–OBS Bridge
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
# The PowerShell helper must live OUTSIDE the .asar archive so powershell.exe can read it.
extraResources:
  - from: resources/ptz-worker.ps1
    to: ptz-worker.ps1
  - from: resources/icon.ico
    to: icon.ico
  # The OBS plugin built in CI (see the release workflow); resources/obs-plugin is empty in dev runs.
  - from: resources/obs-plugin
    to: obs-plugin
# Auto-update feed: electron-builder uploads latest.yml + installer to a GitHub Release (see docs/RELEASING.md).
publish:
  provider: github
  owner: carl-gian
  repo: EMEET-OBS-Bridge
  releaseType: release
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  artifactName: EMEET-OBS-Bridge-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: EMEET–OBS Bridge
